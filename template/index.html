<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Template</title>
    <meta name="author" content="doakey3">
    <meta name="description" content="A template for charting">
    <meta name="keywords" content="key, words, here">

    <link rel="stylesheet" href="../../css/template_style.css">
    <link rel="stylesheet" href="../../css/rich_resizable.css">

    <script src="../../js/mermaid.min.js"></script>
    <script src="../../js/simple_mermaid_init.js"></script>
</head>

<body>
<h1>Template</h1>

<div class="rich-editor-wrap">
    <div class="rich-editor resizable checkable or-selectable" contenteditable="true" spellcheck="false"></div>
</div>

<div id="notes">

<div class="mermaid"></div>

</div>

<div id="references">
    <h2>References</h2>
    <ul>
        <li>Uptodate. <a href="https://www.uptodate.com/contents/treatment-of-irritable-bowel-syndrome-in-adults#!">Treatment of irritable bowel syndrome in adults</a></li>
        <li>AAFP. <a href="https://www.aafp.org/afp/2012/0901/p419.html">Diagnosis and Management of IBS in Adults</a></li>
    </ul>
</div>

<div id="dateModified"></div>
</body>

<script>
    const dateText = "2026-08-24";
    document.getElementById("dateModified").innerHTML = `Date Modified: <time datetime="${dateText}">${dateText}</time>`;
</script>

<script src="../../js/text2html.js"></script>
<script src="../../js/setup_rich_resizables.js"></script>
<script src="../../js/setup_rich_boxes.js"></script>
<script src="../../js/setup_rich_or_select.js"></script>

</html>
