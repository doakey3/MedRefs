<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Epic Assessment and Plan</title>
  <meta name="description" content="Convert an Abridge assessment and plan into clean rich text for Epic.">
  <meta name="keywords" content="epic, assessment, and, plan, abridge">
  <style>
    :root {
      color-scheme: dark;
      --page: #333;
      --editor: #595959;
      --border: #111;
      --text: #fff;
      --muted: #d2d2d2;
      --accent: #d99124;
      --heading: #9fd5ff;
      --button: #444;
      --button-hover: #555;
      --success: #277748;
    }

    * { box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      margin: 0;
      overflow: hidden;
      background: var(--page);
      color: var(--text);
      font: 10pt Tahoma, Arial, sans-serif;
    }

    #app {
      position: absolute;
      inset: 0;
      border: 3px solid var(--border);
      background: var(--editor);
    }

    #editor {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: auto;
      border: 0;
      margin: 0;
      background: var(--editor);
      color: var(--text);
      font-family: Consolas, "Courier New", monospace;
      font-size: 11pt;
    }

    #editor .ace_gutter { display: none; }
    #editor .ace_scroller { left: 0 !important; }
    #editor .ace_content { padding-top: 1px; }
    #editor .ace_diagnosis { color: var(--heading); font-weight: 700; }
    #editor .ace_bullet { color: #ffc164; font-weight: 700; }
    #editor .ace_cursor { color: white; }
    #editor .ace_marker-layer .ace_selection { background: #855700; }
    #editor .ace_invisible { color: #999; }

    .diagnosis {
      color: var(--heading);
      font-weight: 700;
    }

    .bullet-marker {
      color: #ffc164;
      font-weight: 700;
    }

    #clipboardStage {
      position: fixed;
      left: -10000px;
      top: 0;
      width: 700px;
      background: white;
      color: black;
    }

  </style>
</head>
<body>
  <main id="app">
    <div id="editor" aria-label="Abridge assessment and plan"></div>
  </main>
  <div id="clipboardStage" aria-hidden="true"></div>

  <script src="../../js/ace.min.js"></script>
  <script>
  (() => {
    "use strict";

    ace.define("ace/mode/abridge_highlight_rules", ["require", "exports", "module", "ace/lib/oop", "ace/mode/text_highlight_rules"],
      function(require, exports) {
        const oop = require("ace/lib/oop");
        const TextHighlightRules = require("ace/mode/text_highlight_rules").TextHighlightRules;
        const Rules = function() {
          this.$rules = { start: [
            { token: "diagnosis", regex: "^(?!\\s*Recording duration:)\\s*[^\\s\\-*•].*$", next: "body" },
            { token: "bullet", regex: "^\\s*[-*•](?=\\s)" }
          ], body: [
            { token: "empty", regex: "^\\s*$", next: "start" },
            { token: "bullet", regex: "^\\s*[-*•](?=\\s)" }
          ]};
          this.normalizeRules();
        };
        oop.inherits(Rules, TextHighlightRules);
        exports.AbridgeHighlightRules = Rules;
      });
    ace.define("ace/mode/abridge", ["require", "exports", "module", "ace/lib/oop", "ace/mode/text", "ace/mode/abridge_highlight_rules"],
      function(require, exports) {
        const oop = require("ace/lib/oop");
        const TextMode = require("ace/mode/text").Mode;
        const Rules = require("ace/mode/abridge_highlight_rules").AbridgeHighlightRules;
        const Mode = function() { this.HighlightRules = Rules; };
        oop.inherits(Mode, TextMode);
        exports.Mode = Mode;
      });

    const editor = ace.edit("editor");
    editor.session.setMode("ace/mode/abridge");
    editor.setOptions({
      fontFamily: "Consolas, 'Courier New', monospace",
      fontSize: "16pt",
      showGutter: false,
      showPrintMargin: false,
      highlightActiveLine: false,
      highlightSelectedWord: false,
      highlightGutterLine: false,
      displayIndentGuides: false,
      useSoftTabs: true,
      tabSize: 4,
      wrap: true,
      indentedSoftWrap: false
    });
    editor.renderer.setPadding(8);
    editor.renderer.setScrollMargin(5, 5, 0, 0);
    editor.on("paste", event => {
      const pastedLines = normalize(event.text).split("\n");
      if (/^Assessment\s*&\s*Plan$/i.test(pastedLines[0].replace(/^\uFEFF/, "").trim())) {
        pastedLines.shift();
        while (pastedLines.length && pastedLines[0].trim() === "") pastedLines.shift();
      }
      event.text = pastedLines.join("\n");
    });
    const clipboardStage = document.getElementById("clipboardStage");

    const normalize = text => text
      .replace(/\r\n?/g, "\n")
      .replace(/\u00a0/g, " ");

    function editorText() { return normalize(editor.getValue()); }

    function isBullet(line) {
      return /^\s*[-*•]\s+/.test(line);
    }

    function isHeader(lines, index) {
      return lines[index].trim() !== "" &&
        !isBullet(lines[index]) &&
        !/^Recording duration:/i.test(lines[index].trim()) &&
        (index === 0 || lines[index - 1].trim() === "");
    }

    function selectionOffsets() {
      const range = editor.getSelectionRange();
      const backward = editor.selection.isBackwards();
      const start = editor.session.doc.positionToIndex(range.start, 0);
      const end = editor.session.doc.positionToIndex(range.end, 0);
      return {
        anchor: backward ? end : start,
        focus: backward ? start : end
      };
    }

    function setSelection(anchor, focus = anchor) {
      anchor = Math.max(0, anchor);
      focus = Math.max(0, focus);
      const Range = ace.require("ace/range").Range;
      const a = editor.session.doc.indexToPosition(anchor, 0);
      const f = editor.session.doc.indexToPosition(focus, 0);
      const range = focus < anchor ? new Range(f.row, f.column, a.row, a.column)
                                  : new Range(a.row, a.column, f.row, f.column);
      editor.selection.setSelectionRange(range, focus < anchor);
    }

    function replaceTextRange(text, start, end, replacement, caret) {
      const Range = ace.require("ace/range").Range;
      const from = editor.session.doc.indexToPosition(start, 0);
      const to = editor.session.doc.indexToPosition(end, 0);
      editor.session.replace(new Range(from.row, from.column, to.row, to.column), replacement);
      editor.focus();
      setSelection(caret);
    }

    function sectionStarts(text) {
      const lines = text.split("\n");
      const starts = [];
      let offset = 0;
      lines.forEach((line, i) => {
        if (isHeader(lines, i)) starts.push(offset);
        offset += line.length + (i < lines.length - 1 ? 1 : 0);
      });
      return starts;
    }

    function sectionTarget(text, caret, direction) {
      const starts = sectionStarts(text);
      if (!starts.length) return direction < 0 ? 0 : text.length;
      if (direction < 0) {
        for (let i = starts.length - 1; i >= 0; i--) {
          if (starts[i] < caret) return starts[i];
        }
        return 0;
      }
      for (const start of starts) {
        if (start > caret) return start;
      }
      return text.length;
    }

    function moveByWord(direction, selecting) {
      const text = editorText();
      const offsets = selectionOffsets();
      const isWordCharacter = character => /[\p{L}\p{N}_]/u.test(character);
      let target = offsets.focus;

      if (direction < 0) {
        while (target > 0 && !isWordCharacter(text[target - 1])) target--;
        while (target > 0 && isWordCharacter(text[target - 1])) target--;
      } else {
        while (target < text.length && isWordCharacter(text[target])) target++;
        while (target < text.length && !isWordCharacter(text[target])) target++;
      }

      setSelection(selecting ? offsets.anchor : target, target);
    }

    function handleShortcut(event) {
      const offsets = selectionOffsets();
      const text = editorText();

      if (event.command === "eraseLineStart") {
        const low = Math.min(offsets.anchor, offsets.focus);
        const high = Math.max(offsets.anchor, offsets.focus);
        const lineStart = text.lastIndexOf("\n", low - 1) + 1;
        replaceTextRange(text, lineStart, high, "", lineStart);
        return;
      }

      if (event.command === "sectionUp" || event.command === "sectionDown" ||
          event.command === "selectSectionUp" || event.command === "selectSectionDown") {
        const direction = event.command.includes("Up") ? -1 : 1;
        const selecting = event.command.startsWith("select");
        const target = sectionTarget(text, offsets.focus, direction);
        setSelection(selecting ? offsets.anchor : target, target);
      }
    }

    function buildRichContent(text) {
      const container = document.createElement("div");
      container.style.cssText = "font-family:Arial,sans-serif;font-size:11pt;color:#000;";
      const lines = text.split("\n");
      let bulletTable = null;
      let bulletBody = null;

      function closeBulletTable() {
        bulletTable = null;
        bulletBody = null;
      }

      function startBulletTable() {
        const table = document.createElement("table");
        table.setAttribute("width", "576");
        table.setAttribute("cellpadding", "0");
        table.setAttribute("cellspacing", "0");
        table.setAttribute("border", "0");
        table.style.cssText = "width:6in;max-width:6in;table-layout:fixed;border-collapse:collapse;border:0;margin:0;";

        const columns = document.createElement("colgroup");
        const markerColumn = document.createElement("col");
        markerColumn.setAttribute("width", "0");
        markerColumn.style.width = "0";
        const textColumn = document.createElement("col");
        textColumn.setAttribute("width", "576");
        textColumn.style.width = "6in";
        columns.append(markerColumn, textColumn);

        bulletBody = document.createElement("tbody");
        table.append(columns, bulletBody);
        container.appendChild(table);
        bulletTable = table;
      }

      lines.forEach((line, i) => {
        const trimmed = line.trim();
        if (!trimmed) {
          closeBulletTable();
          const spacer = document.createElement("div");
          spacer.appendChild(document.createElement("br"));
          container.appendChild(spacer);
        } else if (isHeader(lines, i)) {
          closeBulletTable();
          const heading = document.createElement("div");
          const strong = document.createElement("strong");
          strong.textContent = trimmed;
          heading.appendChild(strong);
          container.appendChild(heading);
        } else if (isBullet(line)) {
          if (!bulletTable) startBulletTable();
          const row = document.createElement("tr");
          const markerCell = document.createElement("td");
          markerCell.setAttribute("width", "0");
          markerCell.style.cssText = "width:0;white-space:nowrap;vertical-align:top;padding:0 0.08in 0 0;";
          //markerCell.textContent = "•";
          markerCell.textContent = "-";
          const textCell = document.createElement("td");
          textCell.setAttribute("width", "576");
          textCell.style.cssText = "width:6in;vertical-align:top;padding:0;";
          textCell.textContent = line.replace(/^\s*[-*•]\s+/, "");
          row.append(markerCell, textCell);
          bulletBody.appendChild(row);
        } else {
          closeBulletTable();
          const paragraph = document.createElement("div");
          paragraph.textContent = line;
          container.appendChild(paragraph);
        }
      });
      return container;
    }

    function fallbackCopy(rich) {
      clipboardStage.replaceChildren(rich.cloneNode(true));
      const range = document.createRange();
      range.selectNodeContents(clipboardStage);
      const selection = window.getSelection();
      selection.removeAllRanges();
      selection.addRange(range);
      const ok = document.execCommand("copy");
      selection.removeAllRanges();
      clipboardStage.replaceChildren();
      editor.focus();
      return ok;
    }

    async function copyRichText() {
      const text = editorText().trim();
      if (!text) return;
      const rich = buildRichContent(text);
      let copied = false;
      try {
        if (window.ClipboardItem && navigator.clipboard && navigator.clipboard.write) {
          const html = "<!doctype html><html><body>" + rich.outerHTML + "</body></html>";
          await navigator.clipboard.write([new ClipboardItem({
            "text/html": new Blob([html], { type: "text/html" }),
            "text/plain": new Blob([text], { type: "text/plain" })
          })]);
          copied = true;
        }
      } catch (_) { /* Older browsers and file:// pages use the fallback. */ }
      if (!copied) copied = fallbackCopy(rich);
      return copied;
    }

    [
      { name: "eraseLineStart", bindKey: { win: "Ctrl-Shift-Backspace", mac: "Command-Shift-Backspace" } },
      { name: "sectionUp", bindKey: { win: "Ctrl-Up", mac: "Command-Up" } },
      { name: "sectionDown", bindKey: { win: "Ctrl-Down", mac: "Command-Down" } },
      { name: "selectSectionUp", bindKey: { win: "Ctrl-Shift-Up", mac: "Command-Shift-Up" } },
      { name: "selectSectionDown", bindKey: { win: "Ctrl-Shift-Down", mac: "Command-Shift-Down" } },
      { name: "wordLeft", bindKey: { win: "Ctrl-Left", mac: "Option-Left" } },
      { name: "wordRight", bindKey: { win: "Ctrl-Right", mac: "Option-Right" } },
      { name: "selectWordLeft", bindKey: { win: "Ctrl-Shift-Left", mac: "Option-Shift-Left" } },
      { name: "selectWordRight", bindKey: { win: "Ctrl-Shift-Right", mac: "Option-Shift-Right" } },
      { name: "copyRichText", bindKey: { win: "Ctrl-Shift-C", mac: "Command-Shift-C" } }
    ].forEach(command => editor.commands.addCommand({
      ...command,
      exec: () => command.name === "copyRichText"
        ? copyRichText()
        : command.name.includes("Word") || command.name.startsWith("word")
          ? moveByWord(command.name.includes("Left") ? -1 : 1,
              command.name.startsWith("select"))
        : handleShortcut({ command: command.name }),
      readOnly: false
    }));
    editor.focus();
  })();
  </script>
</body>
</html>
